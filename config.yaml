resolution: "1920x1080"  # Full HD default
fps: 30

duration:
  min: 15
  max: 600
  default: 30
  options: [10, 15, 30, 60, 120, 180, 300, 600]

batch:
  default_count: 1

audio:
  enabled: true
  sample_rate: 44100
  target_lufs: -14.0
  ceiling_dbfs: -1.0

editing:
  default_preset: standard
  presets:
    draft:
      motion_scale: 0.65
      quality: draft
      caption_mode: sidecar
    standard:
      motion_scale: 1.0
      quality: standard
      caption_mode: sidecar
    master:
      motion_scale: 1.15
      quality: master
      caption_mode: both

qc:
  enabled: true
  max_av_drift_sec: 0.35
  min_lufs: -35.0
  clipping_peak_dbfs: -0.1
  max_silence_fraction: 0.8
  max_black_fraction: 0.25
  max_frozen_fraction: 0.75
  frame_samples: 12

output:
  directory: "./output"
  thumbnail: true
  bitrate: "8M"          # used for Full HD; 4K uses bitrate_4k
  bitrate_4k: "35M"
  audio_bitrate: "192k"

temp:
  directory: "./temp"
  keep_on_failure: true

performance:
  workers: auto          # paint frames on many CPU cores (auto = CPU count minus 2)
  hardware_encode: true  # Intel Quick Sync / NVIDIA / AMD when FFmpeg supports it
  preview_scale: 0.25
  max_preview_fps: 4     # GUI preview rate; lower = faster renders

logging:
  level: INFO
  directory: "./logs"

database:
  path: "./data/history.db"

engines:
  - kids_storybook
  - how_it_works
  - trend_brief

styles:
  - storybook
  - classroom
  - pulse

# Seeded choices are persisted in every new project for exact replay.
# Set a weight to 0 to disable that choice without changing seed behavior.
visual_variation:
  enabled: true
  version: 1
  backgrounds:
    kids_storybook:
      desk_stack: 1.0
      cozy_corner: 1.0
      window_day: 1.0
      craft_mat: 1.0
      night_lamp: 1.0
      open_spread: 1.0
    how_it_works:
      whiteboard: 1.0
      chalkboard: 1.0
      poster_wall: 1.0
      worksheet: 1.0
      lab_bench: 1.0
      projection: 1.0
    trend_brief:
      neon_ridge: 1.0
      grid_pulse: 1.0
      aurora_bands: 1.0
      static_fizz: 1.0
      mesh_glow: 1.0
      radar_sweep: 1.0
  layouts:
    kids_storybook:
      classic_split: 1.0
      picture_first: 1.0
      hero_center: 1.0
    how_it_works:
      split_right: 1.0
      split_left: 1.0
      stacked: 1.0
      diagram_focus: 1.0
    trend_brief:
      broadcast: 1.0
      card_emphasis: 1.0
      full_bleed: 1.0

# Primary export targets: Full HD + 4K (and common variants)
resolutions:
  - "1920x1080"   # Full HD landscape (default)
  - "3840x2160"   # 4K UHD landscape
  - "1080x1920"   # Full HD vertical
  - "2160x3840"   # 4K vertical
  - "1080x1080"   # Full HD square
  - "2160x2160"   # 4K square

fps_options: [24, 30, 60]

# Trending Brief: public RSS headlines (no article scraping). Offline catalog if the web is down.
trend_feed:
  enabled: true
  cache_dir: "./data/trend_cache"
  cache_minutes: 45
  timeout_sec: 12
  rss_urls:
    - https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
    - https://trends.google.com/trending/rss?geo=US
    - https://feeds.bbci.co.uk/news/rss.xml
    - https://feeds.npr.org/1001/rss.xml

# Optional OpenRouter creative advisor (suggestions only — render stays offline).
# Put OPENROUTER_API_KEY in root `.env` (gitignored). Prefer --curate over per_video.
ai:
  enabled: false
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-4o-mini"
  timeout_sec: 20
  cache_dir: "./data/ai_cache"
  catalog_dir: "./data/ai_catalogs"
  per_video: false

# YouTube Data API v3 — upload to a channel you own (OAuth, not a scraper).
# Save Desktop-app client_secret JSON under data/youtube/ then YouTube → Connect channel.
youtube:
  enabled: false
  privacy: unlisted
  daily_limit: 6
  client_secret: "./data/youtube/client_secret.json"
  token: "./data/youtube/token.json"
